name: Verification

# No path filters and no job-level `if`, like ci.yml: a filtered workflow never
# reports. check.sh only reads the model, so this guards the model, not the app.
# Keeping the two in sync is down to review and the pinned tests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # check.sh pins tla2tools.jar and verifies its checksum.
      - run: verification/autopilot-steps/check.sh
