name: CI

# No path filters and no job-level `if`: this job is a required check, so it has
# to report on every PR. A filtered workflow never reports and strands docs PRs;
# a skipped job counts as passing.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next-env.d.ts and LayoutProps are generated and gitignored.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
